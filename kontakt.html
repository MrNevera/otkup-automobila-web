<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt i Besplatna Procjena – Otkup Automobila</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e293b;
      --primary-d: #0f172a;
      --accent: #e11d48;
      --accent-l: #fb7185;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --text-soft: #64748b;
      --line: rgba(0,0,0,0.08);
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    h1, h2, h3, h4 { font-family: 'Fraunces', serif; color: var(--primary-d); }
    
    .site-nav { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 5%; }
    .logo { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 700; color: var(--primary); text-decoration: none; }
    .logo span { color: var(--accent); }
    .nav-links { display: flex; gap: 2rem; list-style: none; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover, .nav-links a.active { color: var(--accent); }
    .nav-cta { background: var(--accent); color: var(--white)!important; padding: 0.6rem 1.2rem; border-radius: 6px; font-weight: 600; }

    .page-header { background: var(--primary-d); color: var(--white); padding: 4rem 5%; text-align: center; }
    .page-header h1 { font-size: 3rem; color: var(--white); margin-bottom: 1rem; }
    .page-header p { font-size: 1.1rem; color: #cbd5e1; max-width: 600px; margin: 0 auto; }

    .contact-container { max-width: 800px; margin: 4rem auto; padding: 0 5%; }
    .contact-form { background: var(--surface); padding: 3rem; border-radius: 8px; border: 1px solid var(--line); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--primary); }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 0.8rem; border: 1px solid var(--line); border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 1rem; background: var(--bg); }
    .form-group textarea { height: 120px; resize: vertical; }
    .form-submit { background: var(--accent); color: var(--white); border: none; padding: 1rem 2rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
    .form-submit:hover { background: #be123c; }

    footer { background: var(--primary-d); color: #94a3b8; padding: 3rem 5%; text-align: center; border-top: 1px solid rgba(255,255,255,0.1); }
    footer p { margin-bottom: 0.5rem; }

    @media (max-width: 768px) {
      .form-row { grid-template-columns: 1fr; gap: 0; }
      .nav-links { display: none; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a href="index.html" class="logo">Otkup<span>Auto</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Naslovna</a></li>
      <li><a href="o-nama.html">O nama</a></li>
      <li><a href="usluge.html">Usluge</a></li>
      <li><a href="kontakt.html" class="active nav-cta">Besplatna procjena</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1>Kontaktirajte nas</h1>
    <p>Ispunite obrazac u nastavku za brzu besplatnu procjenu vašeg automobila.</p>
  </header>

  <div class="contact-container">
    <form class="contact-form" action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST">
      <div class="form-row">
        <div class="form-group">
          <label>Ime i prezime</label>
          <input type="text" name="ime" required placeholder="Vaše ime">
        </div>
        <div class="form-group">
          <label>Telefon</label>
          <input type="tel" name="telefon" required placeholder="091 234 5678">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Marka i model vozila</label>
          <input type="text" name="vozilo" required placeholder="npr. VW Golf 7">
        </div>
        <div class="form-group">
          <label>Godište i kilometraža</label>
          <input type="text" name="godiste_km" placeholder="npr. 2017., 150.000 km">
        </div>
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" required placeholder="vas@email.com">
      </div>
      <div class="form-group">
        <label>Stanje vozila i dodatne napomene</label>
        <textarea name="poruka" placeholder="Opišite kratko stanje vozila, ima li oštećenja, registraciju..."></textarea>
      </div>
      <button type="submit" class="form-submit">Zatražite besplatnu procjenu →</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2026 Otkup Automobila. Sva prava pridržana.</p>
  </footer>
</body>
</html>
